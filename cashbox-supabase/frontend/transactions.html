<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Box · Transactions</title>
<link rel="stylesheet" href="css/style.css">
<script>
  var _lang = localStorage.getItem("cb_lang") || "en";
  document.documentElement.lang = _lang;
  document.documentElement.dir = _lang === "ar" ? "rtl" : "ltr";
</script>
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="container">
  <div class="panel">
    <h2 data-i18n="transactions_title">Transactions</h2>

    <div class="filters">
      <div class="form-row">
        <label data-i18n="label_search">Search</label>
        <input type="text" id="searchInput" data-i18n-placeholder="placeholder_search" placeholder="Donor, reason, notes…">
      </div>
      <div class="form-row">
        <label data-i18n="label_from_date">From date</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="form-row">
        <label data-i18n="label_to_date">To date</label>
        <input type="date" id="dateTo">
      </div>
      <div class="form-row" style="flex:0;">
        <label>&nbsp;</label>
        <button class="btn" id="applyFiltersBtn" data-i18n="btn_apply">Apply</button>
      </div>
      <div class="form-row" style="flex:0;">
        <label>&nbsp;</label>
        <button class="btn" id="exportBtn" data-i18n="btn_export">⬇ Export CSV</button>
      </div>
    </div>

    <div id="tableWrap">
      <p class="empty-state" data-i18n="loading">Loading…</p>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <h3 data-i18n="modal_edit_title">Edit Transaction</h3>
    <form id="editForm">
      <input type="hidden" id="editId">
      <div class="form-row">
        <label data-i18n="label_amount">Amount</label>
        <input type="number" step="0.01" min="0.01" id="editAmount" required>
      </div>
      <div class="form-row">
        <label data-i18n="label_currency">Currency</label>
        <select id="editCurrency"></select>
      </div>
      <div class="form-row" id="editDonorRow">
        <label id="editDonorLabel" data-i18n="label_donor_name">Donor Name</label>
        <input type="text" id="editDonor">
      </div>
      <div class="form-row">
        <label data-i18n="label_date">Date</label>
        <input type="date" id="editDate" required>
      </div>
      <div class="form-row">
        <label data-i18n="label_notes">Notes</label>
        <textarea id="editNotes" rows="2"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" data-i18n="btn_save_changes">Save Changes</button>
        <button type="button" class="btn" id="closeEditBtn" data-i18n="btn_cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal">
    <h3 data-i18n="modal_delete_title">Delete Transaction</h3>
    <p style="color: var(--text-dim);" data-i18n="delete_confirm_text">This cannot be undone. Are you sure you want to delete this transaction?</p>
    <div class="form-actions">
      <button class="btn btn-danger" id="confirmDeleteBtn" data-i18n="btn_confirm_delete">Delete</button>
      <button class="btn" id="closeDeleteBtn" data-i18n="btn_cancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/i18n.js"></script>
<script src="js/currencies.js"></script>
<script src="js/api.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
