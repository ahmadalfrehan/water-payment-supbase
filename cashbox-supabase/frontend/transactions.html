<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Box · Transactions</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="container">
  <div class="panel">
    <h2>Transactions</h2>

    <div class="filters">
      <div class="form-row">
        <label>Search</label>
        <input type="text" id="searchInput" placeholder="Donor, reason, notes…">
      </div>
      <div class="form-row">
        <label>From date</label>
        <input type="date" id="dateFrom">
      </div>
      <div class="form-row">
        <label>To date</label>
        <input type="date" id="dateTo">
      </div>
      <div class="form-row" style="flex:0;">
        <label>&nbsp;</label>
        <button class="btn" id="applyFiltersBtn">Apply</button>
      </div>
      <div class="form-row" style="flex:0;">
        <label>&nbsp;</label>
        <button class="btn" id="exportBtn">⬇ Export CSV</button>
      </div>
    </div>

    <div id="tableWrap">
      <p class="empty-state">Loading…</p>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>
</div>

<!-- Edit modal -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <h3>Edit Transaction</h3>
    <form id="editForm">
      <input type="hidden" id="editId">
      <div class="form-row">
        <label>Amount</label>
        <input type="number" step="0.01" min="0.01" id="editAmount" required>
      </div>
      <div class="form-row" id="editDonorRow">
        <label id="editDonorLabel">Donor Name</label>
        <input type="text" id="editDonor">
      </div>
      <div class="form-row">
        <label>Date</label>
        <input type="date" id="editDate" required>
      </div>
      <div class="form-row">
        <label>Notes</label>
        <textarea id="editNotes" rows="2"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <button type="button" class="btn" id="closeEditBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal-backdrop" id="deleteModal">
  <div class="modal">
    <h3>Delete Transaction</h3>
    <p style="color: var(--text-dim);">This cannot be undone. Are you sure you want to delete this transaction?</p>
    <div class="form-actions">
      <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      <button class="btn" id="closeDeleteBtn">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/api.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
