<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cash Box · Dashboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="container">
  <div class="cards">
    <div class="card balance">
      <div class="label">Current Balance</div>
      <div class="value" id="balanceVal">—</div>
    </div>
    <div class="card deposits">
      <div class="label">Total Deposits</div>
      <div class="value" id="depositsVal">—</div>
    </div>
    <div class="card withdrawals">
      <div class="label">Total Withdrawals</div>
      <div class="value" id="withdrawalsVal">—</div>
    </div>
    <div class="card">
      <div class="label">Transactions</div>
      <div class="value" id="countVal">—</div>
    </div>
  </div>

  <div class="panel" id="adminActions" style="display:none;">
    <h2>Quick Actions</h2>
    <div class="form-actions">
      <button class="btn btn-primary" id="openDepositBtn">＋ Add Money</button>
      <button class="btn btn-danger" id="openWithdrawBtn">－ Withdraw Money</button>
    </div>
  </div>

  <div class="panel">
    <h2>Latest Transactions</h2>
    <div id="latestTableWrap">
      <p class="empty-state">Loading…</p>
    </div>
    <div style="margin-top:14px;">
      <a href="transactions.html">View all transactions →</a>
    </div>
  </div>
</div>

<!-- Deposit modal -->
<div class="modal-backdrop" id="depositModal">
  <div class="modal">
    <h3>Add Money</h3>
    <form id="depositForm">
      <div class="form-row">
        <label>Amount</label>
        <input type="number" step="0.01" min="0.01" id="depAmount" required>
      </div>
      <div class="form-row">
        <label>Donor Name</label>
        <input type="text" id="depDonor" required>
      </div>
      <div class="form-row">
        <label>Date</label>
        <input type="date" id="depDate">
      </div>
      <div class="form-row">
        <label>Notes</label>
        <textarea id="depNotes" rows="2"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Deposit</button>
        <button type="button" class="btn" id="closeDepositBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- Withdraw modal -->
<div class="modal-backdrop" id="withdrawModal">
  <div class="modal">
    <h3>Withdraw Money</h3>
    <form id="withdrawForm">
      <div class="form-row">
        <label>Amount</label>
        <input type="number" step="0.01" min="0.01" id="wdAmount" required>
      </div>
      <div class="form-row">
        <label>Reason</label>
        <input type="text" id="wdReason" required>
      </div>
      <div class="form-row">
        <label>Date</label>
        <input type="date" id="wdDate">
      </div>
      <div class="form-row">
        <label>Notes</label>
        <textarea id="wdNotes" rows="2"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Withdrawal</button>
        <button type="button" class="btn" id="closeWithdrawBtn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/api.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
